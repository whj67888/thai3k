<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>访问验证 · 泰国3K订单进度工作台</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#f6f9fe 0%,#eaf0fa 55%,#e6ecf8 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#1e293b;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  .wrap{width:100%;max-width:410px}
  .card{
    background:#fff;border:1px solid #e6ecf5;border-radius:18px;
    padding:34px 30px 28px;box-shadow:0 18px 50px rgba(31,58,110,.10),0 2px 8px rgba(31,58,110,.04);
    position:relative;overflow:hidden;text-align:center;
  }
  .card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#3b82f6,#6366f1,#22c55e)}
  .badge{
    width:60px;height:60px;margin:0 auto 18px;border-radius:18px;
    background:linear-gradient(135deg,#eaf1ff,#e8f0ff);
    display:flex;align-items:center;justify-content:center;color:#2563eb;
  }
  h1{font-size:18px;font-weight:650;margin:0 0 6px;letter-spacing:.2px}
  .sub{font-size:13px;color:#64748b;margin:0 0 24px;line-height:1.6}
  .field{position:relative;margin-bottom:12px}
  #gatePwd{
    width:100%;height:50px;padding:0 52px 0 15px;
    font-size:16px;line-height:50px;color:#1e293b;
    border:1px solid #d9e2ef;border-radius:11px;background:#fbfdff;outline:none;
    transition:border-color .18s,box-shadow .18s;
  }
  #gatePwd::placeholder{color:#a3b0c2}
  #gatePwd:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.13);background:#fff}
  #gateEye{
    position:absolute;right:3px;top:3px;width:44px;height:44px;
    border:0;background:transparent;color:#94a3b8;cursor:pointer;
    display:flex;align-items:center;justify-content:center;border-radius:9px;
  }
  #gateEye:hover{color:#2563eb;background:#f1f5fb}
  #gateEye.on{color:#2563eb}
  .err{
    display:none;text-align:left;font-size:13px;line-height:1.5;
    background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;
    border-radius:9px;padding:10px 12px;margin:0 0 12px;
  }
  .err.show{display:block;animation:fade .2s ease}
  .shake{animation:shake .32s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  @keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .remember{
    display:flex;align-items:center;gap:9px;text-align:left;
    font-size:13px;color:#475569;cursor:pointer;
    margin:0 0 14px;padding:4px 2px;min-height:44px;
  }
  .remember input{width:18px;height:18px;flex:none;accent-color:#2563eb;cursor:pointer;margin:0}
  .primary{
    width:100%;height:50px;border:0;border-radius:11px;cursor:pointer;
    background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;
    font-size:16px;font-weight:600;letter-spacing:.5px;
    box-shadow:0 6px 16px rgba(37,99,235,.22);transition:transform .15s,box-shadow .15s,opacity .15s;
  }
  .primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(37,99,235,.28)}
  .primary:active{transform:translateY(0)}
  .primary:disabled{opacity:.65;cursor:default;transform:none;box-shadow:none}
  .foot{font-size:12px;color:#94a3b8;margin:18px 0 0;line-height:1.6}
  .legal{font-size:11.5px;color:#a3b0c2;text-align:center;margin:16px 0 0;line-height:1.6}
  @media(max-width:480px){
    body{padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));align-items:flex-start}
    .wrap{margin-top:min(9vh,64px)}
    .card{padding:28px 22px 24px;border-radius:16px}
    h1{font-size:17px}
  }
</style>

<body>
<div class="wrap">
  <div class="card" id="gateCard">
    <div class="badge">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="10.5" width="16" height="11" rx="2.4"/>
        <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
        <circle cx="12" cy="16" r="1.4" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <h1>泰国3K订单进度工作台</h1>
    <p class="sub">本页面已加密，请输入访问密码</p>
    <form id="gateForm" autocomplete="off">
      <div class="field">
        <input id="gatePwd" type="password" placeholder="访问密码" autocomplete="current-password" autocapitalize="off" spellcheck="false" aria-label="访问密码">
        <button type="button" id="gateEye" aria-label="显示密码">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/>
            <circle cx="12" cy="12" r="2.6"/>
          </svg>
        </button>
      </div>
      <div id="gateErr" class="err" role="alert" aria-live="polite"></div>
      <label class="remember" for="gateRemember">
        <input type="checkbox" id="gateRemember" checked>
        <span>在这台设备上记住我，下次自动进入</span>
      </label>
      <button type="submit" id="gateBtn" class="primary">进入工作台</button>
    </form>
    <p class="foot">取消勾选则仅本次浏览器会话内免重复输入 · 可随时点右下角「退出登录」取消记住</p>
  </div>
  <p class="legal">记住状态仅保存在本机浏览器；清除浏览数据、无痕模式或更换浏览器后需重新输入密码。</p>
</div>
<script>
(function(){
  var G = window.__GATE__;
  var SALT = (G && G.s) ? G.s : 'none';
  /* 只存「PBKDF2 派生的 32 字节密钥」，绝不存明文密码、也绝不存解密后的页面内容。
     key 名绑定 salt（salt 仅随密码变化）：改密码 → salt 变 → 旧凭据失效；
     日常数据更新时 salt 不变，已记住的设备无需重新输密码。 */
  var LKEY = 'wb_gate_key_' + SALT;      // localStorage：长期记住此设备
  var SKEY = 'wb_gate_skey_' + SALT;    // sessionStorage：仅本次会话
  var errEl = document.getElementById('gateErr');
  var form  = document.getElementById('gateForm');
  var pwd   = document.getElementById('gatePwd');
  var btn   = document.getElementById('gateBtn');
  var eye   = document.getElementById('gateEye');
  var card  = document.getElementById('gateCard');
  var rememberEl = document.getElementById('gateRemember');
  var tries = 0, lockUntil = 0, busy = false;

  function b64(s){
    var bin = atob(s), out = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function toB64(bytes){
    var s = '';
    for(var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }
  function showErr(msg){
    errEl.textContent = msg; errEl.classList.add('show');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  }
  function hideErr(){ errEl.classList.remove('show'); errEl.textContent = ''; }
  function setBusy(v){
    busy = v; btn.disabled = v; pwd.disabled = v;
    btn.textContent = v ? '验证中…' : '进入工作台';
  }
  function fatal(msg){ showErr(msg); pwd.disabled = true; btn.disabled = true; }
  function clearSaved(){
    try{ localStorage.removeItem(LKEY); sessionStorage.removeItem(SKEY); }catch(e){}
  }
  function readSaved(){
    try{
      var v = localStorage.getItem(LKEY);
      if(v) return v;
      return sessionStorage.getItem(SKEY);
    }catch(e){ return null; }
  }
  /* 清理旧 salt 留下的凭据，以及早期版本缓存的「解密后明文页面」。 */
  function cleanup(){
    try{
      [localStorage, sessionStorage].forEach(function(st){
        var del = [];
        for(var i = 0; i < st.length; i++){
          var k = st.key(i); if(!k) continue;
          if(k.indexOf('wb_gate_html_') === 0){ del.push(k); continue; }
          if(k.indexOf('wb_gate_key_') === 0 && k !== LKEY) del.push(k);
          if(k.indexOf('wb_gate_skey_') === 0 && k !== SKEY) del.push(k);
        }
        del.forEach(function(k){ try{ st.removeItem(k); }catch(e){} });
      });
    }catch(e){}
  }
  function waitDocReady(){
    if(document.readyState !== 'loading') return Promise.resolve();
    return new Promise(function(r){ document.addEventListener('DOMContentLoaded', r, { once:true }); });
  }
  /* 解锁后在页面右下角放一个「退出登录」：清除本机记住状态并重新验证。 */
  function addLogout(){
    try{
      if(document.getElementById('wbGateLogout')) return;
      var b = document.createElement('button');
      b.id = 'wbGateLogout'; b.type = 'button'; b.textContent = '退出登录';
      b.title = '清除本机记住状态，下次需要重新输入密码';
      b.style.cssText = 'position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));'
        + 'z-index:99999;min-height:44px;padding:0 16px;border:1px solid #d9e2ef;'
        + 'border-radius:999px;background:rgba(255,255,255,.95);color:#475569;'
        + 'font-size:12px;font-family:inherit;cursor:pointer;'
        + 'box-shadow:0 2px 10px rgba(30,58,110,.14);';
      b.onclick = function(){ clearSaved(); location.reload(); };
      document.body.appendChild(b);
    }catch(e){}
  }
  function showPage(html){
    document.open(); document.write(html); document.close();
    setTimeout(addLogout, 400);
  }

  /* 从密码派生 32 字节密钥（deriveBits 便于持久化，避免存明文密码）。 */
  async function deriveBytes(p){
    var enc = new TextEncoder();
    var km = await crypto.subtle.importKey('raw', enc.encode(p), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits(
      { name:'PBKDF2', salt:b64(G.s), iterations:G.it, hash:'SHA-256' }, km, 256
    );
    return new Uint8Array(bits);
  }
  /* 用已保存的密钥直接解密（跳过 PBKDF2，毫秒级）；AES-GCM 认证同时校验凭据是否有效。 */
  async function decrypt(keyBytes){
    var key = await crypto.subtle.importKey('raw', keyBytes, { name:'AES-GCM' }, false, ['decrypt']);
    var ct = b64(G.c), tag = b64(G.t);
    var buf = new Uint8Array(ct.length + tag.length);
    buf.set(ct, 0); buf.set(tag, ct.length);
    var plain = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv:b64(G.i), tagLength:128 }, key, buf
    );
    return new TextDecoder('utf-8').decode(plain);
  }

  if(!G || !G.c){ fatal('页面数据缺失，请刷新重试。'); return; }
  if(!window.crypto || !crypto.subtle || !window.TextEncoder || !window.TextDecoder){
    fatal('当前环境不支持安全解密，请通过 https:// 地址打开本页。');
    return;
  }

  var isLogout = /[?&]logout=1(?:&|$)/.test(location.search);
  if(isLogout) clearSaved();
  cleanup();

  /* ---- 自动放行：有凭据就直接解密渲染，全程不出现密码门 ----
     解密是异步的，因此 document.write 一定发生在文档解析完成之后，
     不会出现「密码门 UI 与工作台内容混杂」的残留（此前实测踩过坑）。 */
  var saved = isLogout ? null : readSaved();
  if(saved){
    try{ document.documentElement.style.visibility = 'hidden'; }catch(e){}
    decrypt(b64(saved)).then(function(html){
      if(!html || html.indexOf('<') < 0) throw new Error('invalid payload');
      return waitDocReady().then(function(){ showPage(html); });
    }).catch(function(){
      clearSaved();
      try{ document.documentElement.style.visibility = ''; }catch(e){}
    });
  }

  form.addEventListener('submit', async function(ev){
    ev.preventDefault();
    if(busy) return;
    var p = pwd.value;
    if(!p){ showErr('请输入访问密码'); return; }
    if(Date.now() < lockUntil){ showErr('尝试过于频繁，请稍后再试'); return; }
    hideErr(); setBusy(true);
    try{
      var kb = await deriveBytes(p);
      var html = await decrypt(kb);       // 密码错误 → GCM 认证失败
      if(!html || html.indexOf('<') < 0) throw new Error('invalid payload');
      try{
        if(rememberEl.checked){
          localStorage.setItem(LKEY, toB64(kb));
          sessionStorage.removeItem(SKEY);
        }else{
          sessionStorage.setItem(SKEY, toB64(kb));
          localStorage.removeItem(LKEY);
        }
      }catch(e){ /* 隐私模式 / 配额不足：本次仍正常进入，只是不记住 */ }
      await waitDocReady();
      showPage(html);
    }catch(e){
      tries++; pwd.value = '';
      if(tries >= 3){
        lockUntil = Date.now() + 5000; tries = 0;
        showErr('连续 3 次密码错误，请 5 秒后再试');
      }else{
        showErr('密码错误，请重新输入');
      }
      try{ pwd.focus(); }catch(e2){}
    }finally{
      setBusy(false);
    }
  });

  eye.addEventListener('click', function(){
    var show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    eye.classList.toggle('on', show);
    eye.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
    try{ pwd.focus(); }catch(e){}
  });

  try{ if(window.matchMedia && matchMedia('(hover:hover)').matches) pwd.focus(); }catch(e){}
})();
</script>
</body>
</html>
